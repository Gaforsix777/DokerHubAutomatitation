name Despliegue de DockerHub
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: inicioas sesion en docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USARNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configurar docker build
        uses: docker/setup-buildx-action@v3
      - name: Construir y publicar la imagen de Docker
        uses: docker/build-push-action@v5
        with:
          context:
          file: ./dockerfile
          push: true
          tags:
          ${{ secrets.DOCKER_USARNAME }}/mi-web-plana:latest
          ${{ secrets.DOCKER_PASSWORD }}/mi-web-plana:${{ github.sha }}
